logging.level.root=INFO

spring.application.name=rate-provider
server.port=8085
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=20s

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/readyz
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${spring.application.instance_id:${random.uuid}}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.add-additional-paths=true
management.info.build.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90
